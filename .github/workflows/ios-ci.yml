name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate (KyaCore + app, same as local)
    # Unverified: which Xcodes this image ships changes over time. The select step below
    # fails fast with a clear message if none is new enough (Swift >= 6.2).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # A moving major tag; pinning to a commit SHA is tracked in docs/PLAN.md section 6.3 (L6).
      - uses: actions/checkout@v4

      - name: Select newest Xcode (requires Swift >= 6.2)
        run: scripts/ci-select-xcode.sh

      # Lint, architecture rules, -warnings-as-errors build, tests (local TZ and
      # America/New_York), coverage gate, then the app build and unit + UI tests.
      - name: Quality gate
        run: APP=1 scripts/check.sh
