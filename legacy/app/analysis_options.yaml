include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # See packages/kya_core/analysis_options.yaml for why this is relaxed.
    public_member_api_docs: ignore
