include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Doc comments are enforced on the public API surface by convention
    # (AGENTS.md 0), not by the linter, to avoid noisy false positives on
    # private helpers.
    public_member_api_docs: ignore
